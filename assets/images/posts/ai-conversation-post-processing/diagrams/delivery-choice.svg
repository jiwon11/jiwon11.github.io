<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 752 384" width="752" height="384" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="delivery-choice-title delivery-choice-desc">
<title id="delivery-choice-title">필요한 전달 보장에 따른 선택</title>
