<title id="redirect-ssrf-guard-title">리다이렉트도 새로운 요청이다</title>
<desc id="redirect-ssrf-guard-desc">최초 URL만 검증하고 자동 리다이렉트를 따르면 내부 자원에 접근할 수 있지만, 자동 리다이렉트를 끄고 홉마다 재검증하면 요청을 차단할 수 있다.</desc>
