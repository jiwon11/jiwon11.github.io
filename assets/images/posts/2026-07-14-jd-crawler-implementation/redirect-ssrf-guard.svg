<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1040 650" role="img" aria-labelledby="title desc">
  <title id="title">리다이렉트 기반 SSRF 우회와 방어</title>
  <desc id="desc">최초 URL만 검사하고 자동 리다이렉트를 따르면 내부 주소에 접근할 수 있지만, 자동 추적을 끄고 각 Location을 다시 검사하면 차단할 수 있다</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .section { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .label { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; text-anchor: middle; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; filter: url(#shadow); }
      .pass { fill: #ecfdf5; stroke: #10b981; }
      .danger { fill: #fef2f2; stroke: #ef4444; }
      .guard { fill: #ecfeff; stroke: #06b6d4; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
      .danger-edge { fill: none; stroke: #ef4444; stroke-width: 2.2; marker-end: url(#redArrow); }
      .divider { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect x="0" y="0" width="1040" height="650" rx="24" fill="url(#bg)"/>
  <text x="520" y="50" class="title" text-anchor="middle">리다이렉트도 새로운 요청이다</text>

  <text x="54" y="102" class="section">최초 URL만 검증 + 자동 리다이렉트</text>
  <rect class="node pass" x="54" y="126" width="210" height="86"/>
  <text x="159" y="160" class="label">공개 URL</text>
  <text x="159" y="186" class="small">Guard 통과</text>

  <rect class="node" x="410" y="126" width="220" height="86"/>
  <text x="520" y="160" class="label">302 Location</text>
  <text x="520" y="186" class="small">내부 주소로 변경</text>

  <rect class="node danger" x="776" y="126" width="210" height="86"/>
  <text x="881" y="158" class="label">내부 자원 접근</text>
  <text x="881" y="184" class="small">SSRF 우회 위험</text>

  <path class="danger-edge" d="M264 169 H405"/>
  <path class="danger-edge" d="M630 169 H771"/>

  <line class="divider" x1="54" y1="285" x2="986" y2="285"/>

  <text x="54" y="332" class="section">자동 리다이렉트 OFF + 홉마다 재검증</text>
  <rect class="node pass" x="54" y="358" width="190" height="86"/>
  <text x="149" y="392" class="label">공개 URL</text>
  <text x="149" y="418" class="small">1차 Guard</text>

  <rect class="node" x="310" y="358" width="190" height="86"/>
  <text x="405" y="392" class="label">302 수신</text>
  <text x="405" y="418" class="small">Location 직접 해석</text>

  <rect class="node guard" x="566" y="358" width="190" height="86"/>
  <text x="661" y="392" class="label">목적지 재검증</text>
  <text x="661" y="418" class="small">2차 Guard</text>

  <rect class="node danger" x="822" y="358" width="164" height="86"/>
  <text x="904" y="392" class="label">요청 차단</text>
  <text x="904" y="418" class="small">invalid_url</text>

  <path class="edge" d="M244 401 H305"/>
  <path class="edge" d="M500 401 H561"/>
  <path class="danger-edge" d="M756 401 H817"/>

  <rect x="220" y="510" width="600" height="86" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="520" y="544" class="label">구현 원칙</text>
  <text x="520" y="572" class="small">Location을 URI.resolve로 정규화하고 최대 5회까지만 추적한다</text>
</svg>
