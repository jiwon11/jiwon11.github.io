<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 360" width="720" height="360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ecs-target-architecture-dark-title ecs-target-architecture-dark-desc">
<title id="ecs-target-architecture-dark-title">목표 구조</title>
<desc id="ecs-target-architecture-dark-desc">ECS 클러스터의 EC2(T3) 컨테이너 인스턴스 안에서 Nginx reverse-proxy-container가 요청을 example-app-container의 3000번 포트로 전달하고, 그 안에서 Node.js 기반 NestJS 애플리케이션이 실행되는 구조.</desc>
