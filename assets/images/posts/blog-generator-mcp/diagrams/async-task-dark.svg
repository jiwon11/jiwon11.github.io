<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 616" width="840" height="616" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="async-task-dark-title async-task-dark-desc">
<title id="async-task-dark-title">비동기 작업과 상태 조회</title>
<desc id="async-task-dark-desc">MCP 서버가 작업을 pending으로 만들고 task_id를 먼저 돌려준 뒤, 백그라운드에서 AI를 호출하며 sql.js DB에 진행 상태를 기록하고, 클라이언트가 blog_get_status로 결과를 조회하는 순서.</desc>
