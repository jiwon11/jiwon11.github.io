<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 400" width="720" height="400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="n-plus-one-title n-plus-one-desc">
<title id="n-plus-one-title">목록 조회의 N+1 쿼리</title>
<desc id="n-plus-one-desc">목록을 한 번 조회한 뒤 구성원마다 집계 데이터를 다시 조회해 쿼리가 구성원 수만큼 늘어나는 순서.</desc>
