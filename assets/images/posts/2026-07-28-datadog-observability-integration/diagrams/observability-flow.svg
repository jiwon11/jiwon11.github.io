<title id="observability-flow-title">Datadog 관측성 데이터 흐름</title>
<desc id="observability-flow-desc">Spring Boot API의 JSON 구조화 로그는 stdout, CloudWatch Logs, Forwarder Lambda를 거쳐 Datadog Logs로, OpenAI 호출의 수동 스팬은 dd-java-agent의 Agentless 경로로 LLM Observability에 전달되며, 호스트 Agent가 없다는 운영 제약을 함께 표시한다.</desc>
