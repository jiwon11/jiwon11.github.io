<title id="llm-span-finish-title">호출 결과 기록과 스팬 종료</title>
<desc id="llm-span-finish-desc">OpenAI 호출이 성공하면 ai_call 성공 로그와 annotateIO·setMetrics를, 실패하면 ai_call 실패 로그와 addThrowable을 남기고, 어느 쪽이든 finally에서 finish를 runCatching으로 호출하는 순서.</desc>
